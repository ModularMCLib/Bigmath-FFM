name: Publish Version

on:
  workflow_call:
    inputs:
      simulate:
        required: false
        type: boolean
        default: false
      tag-name:
        description: Release tag associated with the immutable JAR
        required: true
        type: string
      version:
        description: Branch to update after a successful release
        required: true
        type: string
      artifact-name:
        description: Actions artifact containing the already-built JAR and release.sha256
        required: true
        type: string
      changelog-body:
        description: Change notes to insert into CHANGELOG.md
        required: false
        type: string
    secrets:
      MAVEN_URL:
        required: false
      MAVEN_USER:
        required: false
      MAVEN_PASSWORD:
        required: false

jobs:
  publish:
    name: Publish Packaged JAR
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ver: ${{ steps.version.outputs.value }}
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag-name }}
      - uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Download the packaged release JAR
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: release/
      - name: Locate packaged JAR
        id: jar
        run: |
          cd release
          jar_path="$(find "$PWD" -maxdepth 1 -type f -name '*.jar' -print -quit)"
          echo "path=$jar_path" >> "$GITHUB_OUTPUT"
      - name: Read version
        id: version
        run: echo "value=$(grep -oP 'mod_version\s*=\s*\K.*' gradle.properties | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Publish the Java and Kotlin artifacts to Maven
        if: ${{ !inputs.simulate }}
        env:
          MAVEN_URL: ${{ secrets.MAVEN_URL }}
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          test -n "$MAVEN_URL"
          test -n "$MAVEN_USER"
          test -n "$MAVEN_PASSWORD"
          ./gradlew publishMavenJavaPublicationToReleaseRepository \
            :bigmath-ffm-kt:publishMavenJavaPublicationToReleaseRepository \
            "-PreleaseJarFile=${{ steps.jar.outputs.path }}" \
            -x releaseJar -x cmakeConfigure -x buildNative -x copyNativeLib -x processResources

  bump-version-and-changelog:
    name: Bump Version and Update Changelog
    needs: publish
    if: ${{ inputs.simulate == false && always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
      - name: Bump version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c gh/release-${{ github.run_id }}
          current="$(grep -oP 'mod_version\s*=\s*\K.*' gradle.properties | tail -1)"
          bumped="$(echo "$current" | awk -F. '/[0-9]+\./{$NF++;print}' OFS=.)"
          sed -i "s/mod_version\s*=\s*$current/mod_version = $bumped/" gradle.properties
          git add gradle.properties
          git commit -m "Bump version to $bumped" || true
      - name: Prepend changelog
        if: inputs.changelog-body
        env:
          CHANGELOG_BODY: ${{ inputs.changelog-body }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("CHANGELOG.md")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          body = os.environ["CHANGELOG_BODY"].rstrip("\n") + "\n"
          path.write_text("".join(lines[:2]) + body + "".join(lines[2:]), encoding="utf-8")
          PY
          git add CHANGELOG.md
          git commit -m "Update CHANGELOG for ${{ needs.publish.outputs.ver }}" || true
      - name: Push and create PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push --set-upstream origin gh/release-${{ github.run_id }}
          gh pr create \
            -B ${{ inputs.version }} \
            -H gh/release-${{ github.run_id }} \
            --title "Post-release: bump version and update changelog" \
            --body "Automated after release ${{ needs.publish.outputs.ver }}" \
            --label "ignore changelog"
