name: Native Build

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.decide.outputs.native || 'false' }}
    steps:
      - name: Decide whether to run the six-platform matrix
        id: decide
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          if grep -q 'ci:skip' <<<"$LABELS"; then
            echo "native=false" >> "$GITHUB_OUTPUT"
          elif grep -q 'ci:native' <<<"$LABELS"; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

  native-full:
    needs: check
    if: needs.check.outputs.native == 'true'
    uses: ./.github/workflows/native-artifacts.yml
