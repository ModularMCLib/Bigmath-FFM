name: Snapshot Release

on:
  push:
    branches: ['main']
    paths: ['src/**', '*.gradle', 'gradle.properties', 'gradle/**', 'settings.gradle', '.github/workflows/**', '.github/scripts/**']

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    uses: ./.github/workflows/native-artifacts.yml

  package:
    name: Package Six-Platform Snapshot
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CI: 'true'
      SNAPSHOT: 'true'
      PUBLISH: ${{ !contains(github.event.head_commit.message, '[no-snapshot]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Download the six native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native/
          merge-multiple: true
      - name: Assemble without a local native build
        run: |
          chmod +x gradlew
          ./gradlew releaseJar -x cmakeConfigure -x buildNative -x copyNativeLib -x processResources
      - name: Prepare immutable snapshot asset
        id: asset
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p dist
          source_jar="$(find build/release -maxdepth 1 -type f -name '*.jar' -print -quit)"
          short_sha="$(printf '%s' '${{ github.sha }}' | cut -c 1-7)"
          timestamp="$(date --utc '+%Y%m%d-%H%M%S')"
          base="$(basename "$source_jar" .jar)"
          asset="dist/${base/-SNAPSHOT/-SNAPSHOT+${timestamp}-${short_sha}}.jar"
          cp "$source_jar" "$asset"
          (cd dist && sha256sum *.jar > release.sha256)
          echo "jar=$asset" >> "$GITHUB_OUTPUT"
      - name: Get version
        id: version
        if: env.PUBLISH == 'true'
        run: echo "value=$(grep -oP 'mod_version\s*=\s*\K.*' gradle.properties | head -1)" >> "$GITHUB_OUTPUT"
      - name: Build snapshot changelog
        id: changelog
        if: env.PUBLISH == 'true'
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configuration: './.github/json/config-latest.json'
          toTag: ${{ github.ref }}
          fetchViaCommits: true
          failOnError: false
      - name: Publish snapshot
        if: env.PUBLISH == 'true'
        uses: andelf/nightly-release@v1
        with:
          tag_name: latest
          name: '${{ steps.version.outputs.value }}-SNAPSHOT+${{ github.sha }}'
          prerelease: true
          body: |
            ## Bigmath-FFM Snapshot

            Commit: `${{ github.sha }}`

            ${{ steps.changelog.outputs.changelog }}

            > [!WARNING]
            > Pre-release snapshot — not for production use.
          files: |
            dist/*.jar
            dist/release.sha256
