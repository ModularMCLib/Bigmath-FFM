name: Publish on Release

on:
  release:
    types: [prereleased, released]

jobs:
  meta:
    name: Generate Changelog
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          sparse-checkout: '.github/json'
      - name: Generate changelog
        id: changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configuration: './.github/json/config.json'
          ignorePreReleases: true
          fetchViaCommits: true
          failOnError: false

  native:
    uses: ./.github/workflows/native-artifacts.yml

  package:
    name: Package and Verify the Release JAR
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Download the six native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native/
          merge-multiple: true
      - name: Assemble without a local native build
        run: |
          chmod +x gradlew
          ./gradlew releaseJar -x cmakeConfigure -x buildNative -x copyNativeLib -x processResources
      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p dist
          cp build/release/*.jar dist/
          (
            cd dist
            sha256sum ./*.jar > release.sha256
          )
      - name: Upload release JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-jar
          path: dist/
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Upload Verified JAR to GitHub Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-jar
          path: release/
      - name: Upload the release JAR
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release/*.jar
            release/release.sha256
          fail_on_unmatched_files: true
          overwrite_files: false

  publish:
    name: Publish the Same JAR to Maven
    needs: [meta, package, github-release]
    if: ${{ github.event.release.prerelease == false }}
    uses: ./.github/workflows/publish.yml
    secrets: inherit
    with:
      simulate: ${{ startsWith(github.event.release.name, 'simulate') || github.repository_owner != 'ModularMCLib' }}
      tag-name: ${{ github.ref_name }}
      version: main
      artifact-name: release-jar
      changelog-body: ${{ needs.meta.outputs.changelog }}
