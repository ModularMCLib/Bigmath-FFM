def nativeClassifier = {
	def os = System.getProperty("os.name").toLowerCase()
	def arch = System.getProperty("os.arch").toLowerCase()
	def osPart = os.contains("win") ? "windows" : os.contains("mac") ? "macos" : "linux"
	def archPart = arch.contains("amd64") || arch.contains("x86_64") ? "x86-64" : "aarch64"
	"${osPart}-${archPart}"
}()

def nativeLibName = System.getProperty("os.name").toLowerCase().contains("win")
		? "bigmath_ffm.dll"
		: System.getProperty("os.name").toLowerCase().contains("mac")
				? "libbigmath_ffm.dylib"
				: "libbigmath_ffm.so"

def cmakeBuildDir = layout.buildDirectory.dir("native").get().asFile
def cmakeInstallLibDir = new File(cmakeBuildDir, "lib")
def generatedNativeRootDir = layout.buildDirectory.dir("generated/local-native").get().asFile
def generatedNativeDir = new File(generatedNativeRootDir, nativeClassifier)
def nativePatterns = System.getProperty("os.name").toLowerCase().contains("win")
		? ["*.dll"]
		: System.getProperty("os.name").toLowerCase().contains("mac")
				? ["*.dylib"]
				: ["*.so", "*.so.*"]
def isWindowsHost = System.getProperty("os.name").toLowerCase().contains("win")
def isX64Host = {
	def arch = System.getProperty("os.arch").toLowerCase()
	arch.contains("amd64") || arch.contains("x86_64")
}()
def cudaArch = (project.findProperty("bigmathCudaArch") ?: System.getenv("BIGMATH_CUDA_ARCH"))?.toString()
def resolveExecutable = { String explicitProperty, String envName, List<String> candidates, String executableName ->
	def explicit = project.findProperty(explicitProperty)?.toString() ?: System.getenv(envName)
	if (explicit && new File(explicit).exists()) {
		return new File(explicit)
	}
	def pathMatch = System.getenv("PATH")?.split(File.pathSeparator)?.collect { new File(it, executableName) }?.find { it.exists() }
	if (pathMatch) {
		return pathMatch
	}
	return candidates.collect { new File(it) }.find { it.exists() }
}
def resolveCudaRoot = {
	def nvccName = isWindowsHost ? "nvcc.exe" : "nvcc"
	def explicit = project.findProperty("cudaToolkitRoot")?.toString()
			?: System.getenv("CUDAToolkit_ROOT")
			?: System.getenv("CUDA_PATH")
	if (explicit && new File(explicit, "bin/${nvccName}").exists()) {
		return new File(explicit)
	}
	def defaultRoot = isWindowsHost
			? new File("C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA")
			: new File("/usr/local")
	def versions = defaultRoot.exists()
			? defaultRoot.listFiles()?.findAll { new File(it, "bin/${nvccName}").exists() }?.sort { a, b -> b.name <=> a.name }
			: []
	return versions ? versions[0] : null
}
def cudaRoot = resolveCudaRoot()
def cudaNvcc = cudaRoot ? new File(cudaRoot, isWindowsHost ? "bin/nvcc.exe" : "bin/nvcc") : null
def cmakeExecutable = resolveExecutable(
		"cmakeExecutable",
		"BIGMATH_CMAKE",
		isWindowsHost ? ["D:/JetBrains/CLion/bin/cmake/win/x64/bin/cmake.exe"] : [],
		isWindowsHost ? "cmake.exe" : "cmake"
)
def ninjaExecutable = resolveExecutable(
		"ninjaExecutable",
		"BIGMATH_NINJA",
		isWindowsHost ? ["D:/JetBrains/CLion/bin/ninja/win/x64/ninja.exe"] : [],
		isWindowsHost ? "ninja.exe" : "ninja"
)
def msvcCompiler = resolveExecutable(
		"msvcCompiler",
		"CXX",
		[],
		"cl.exe"
)

def resolveCmakePrefixPath = {
	def explicitPrefix = project.findProperty("cmakePrefixPath")?.toString()
	if (!explicitPrefix) {
		explicitPrefix = System.getenv("BIGMATH_CMAKE_PREFIX_PATH") ?: System.getenv("CMAKE_PREFIX_PATH")
	}
	if (explicitPrefix) {
		return explicitPrefix
	}

	def tripletHint = (project.findProperty("vcpkgTriplet")
			?: System.getenv("BIGMATH_VCPKG_TRIPLET")
			?: System.getenv("VCPKG_TARGET_TRIPLET")
			?: (isWindowsHost && isX64Host ? "x64-windows" : null))?.toString()
	def arch = System.getProperty("os.arch").toLowerCase()
	def archPrefix = arch.contains("aarch64") || arch.contains("arm64") ? "arm64-" : "x64-"
	def isWindows = System.getProperty("os.name").toLowerCase().contains("win")
	def installedRoots = [
			layout.projectDirectory.dir("vcpkg_installed").asFile,
			System.getenv("VCPKG_ROOT") ? new File(System.getenv("VCPKG_ROOT"), "installed") : null
	].findAll { it != null && it.exists() }

	def windowsCompilerFamily = {
		def explicitCompiler = (project.findProperty("windowsCompilerFamily")
				?: System.getenv("BIGMATH_WINDOWS_COMPILER")
				?: "msvc")?.toString()?.toLowerCase()
		if (explicitCompiler in ["mingw", "msvc"]) {
			return explicitCompiler
		}

		def compilerHints = [System.getenv("CXX"), System.getenv("CC")]
				.findAll { it != null && !it.isBlank() }
				.collect { it.toLowerCase() }

		if (compilerHints.any { it == "cl" || it.endsWith("\\cl.exe") || it.endsWith("/cl.exe") }) {
			return "msvc"
		}
		if (compilerHints.any { it.contains("gcc") || it.contains("g++") || it.contains("mingw") }) {
			return "mingw"
		}
		return null
	}

	def pickCandidate = { File installedRoot ->
		def tripletDirs = installedRoot.listFiles()?.findAll { candidate ->
			candidate.isDirectory() &&
					new File(candidate, "include/gmp.h").exists() &&
					new File(candidate, "include/mpfr.h").exists()
		} ?: []
		if (tripletDirs.isEmpty()) {
			return null
		}
		if (tripletHint) {
			def hinted = tripletDirs.find { it.name == tripletHint }
			if (hinted != null) {
				return hinted
			}
		}
		def sameArch = tripletDirs.findAll { it.name.startsWith(archPrefix) }
		if (sameArch.isEmpty()) {
			return tripletDirs[0]
		}

		if (isWindows) {
			def msvcTriplets = sameArch.findAll { !it.name.contains("mingw") }
			def compilerFamily = windowsCompilerFamily()
			def compatible = compilerFamily == "msvc" ? msvcTriplets : []
			if (compatible.isEmpty()) {
				throw new GradleException(
						"No Windows vcpkg triplets compatible with compiler family '${compilerFamily}' " +
						"for ${archPrefix}. Available: ${sameArch*.name}"
				)
			}

			def preferred = compatible.find { it.name == "${archPrefix}windows" }
			return preferred ?: compatible[0]
		}

		def preferred = sameArch.find { it.name.contains("dynamic") }
		return preferred ?: sameArch[0]
	}

	def selected = installedRoots.collect { pickCandidate(it) }.find { it != null }
	return selected?.absolutePath?.replace('\\', '/')
}

def cmakeConfigure = tasks.register('cmakeConfigure', Exec) {
	description = 'Configure CMake for native library'
	workingDir = cmakeBuildDir
	inputs.dir("src/main/cpp").withPathSensitivity(PathSensitivity.RELATIVE)
	outputs.file("${cmakeBuildDir}/CMakeCache.txt")
	doFirst {
		def cmakePrefixPath = resolveCmakePrefixPath()
		cmakeBuildDir.mkdirs()
		if (cmakeExecutable == null) {
			throw new GradleException("CMake executable was not found. Set -PcmakeExecutable=... or BIGMATH_CMAKE.")
		}
		if (ninjaExecutable == null) {
			throw new GradleException("Ninja executable was not found. Set -PninjaExecutable=... or BIGMATH_NINJA.")
		}
		if ((isWindowsHost || System.getProperty("os.name").toLowerCase().contains("linux")) && isX64Host && cudaRoot == null) {
			throw new GradleException("CUDA Toolkit was not found. Set -PcudaToolkitRoot=... or CUDAToolkit_ROOT/CUDA_PATH.")
		}
		if (isWindowsHost && isX64Host && msvcCompiler == null) {
			throw new GradleException("MSVC cl.exe was not found. Run from a VS Developer shell or install Visual Studio C++ build tools.")
		}
		if (isWindowsHost && isX64Host && !cmakePrefixPath) {
			throw new GradleException("Windows CUDA builds require GMP/MPFR from the vcpkg x64-windows triplet. Install it or set -PcmakePrefixPath=...")
		}
		if (cmakePrefixPath) {
			logger.lifecycle("Using CMake prefix path: ${cmakePrefixPath}")
		} else if (System.getProperty("os.name").toLowerCase().contains("win")) {
			logger.lifecycle("No CMake prefix path detected on Windows; native build may fall back to stubs")
		}
		def command = [
				cmakeExecutable.absolutePath,
				'-S', file("src/main/cpp").absolutePath,
				'-B', cmakeBuildDir.absolutePath,
				'-G', 'Ninja',
				"-DCMAKE_MAKE_PROGRAM=${ninjaExecutable.absolutePath.replace('\\', '/')}",
				"-DCMAKE_BUILD_TYPE=${project.findProperty('buildType') ?: 'Release'}",
				"-DCMAKE_INSTALL_PREFIX=${cmakeBuildDir}"
		]
		if (cmakePrefixPath) {
			command << "-DCMAKE_PREFIX_PATH=${cmakePrefixPath}"
		}
		if (isWindowsHost && isX64Host) {
			command << "-DVCPKG_TARGET_TRIPLET=x64-windows"
		}
		if (cudaArch) {
			command << "-DCMAKE_CUDA_ARCHITECTURES=${cudaArch}"
		}
		if (cudaRoot) {
			command << "-DCUDAToolkit_ROOT=${cudaRoot.absolutePath.replace('\\', '/')}"
		}
		if (cudaNvcc && cudaNvcc.exists()) {
			command << "-DCMAKE_CUDA_COMPILER=${cudaNvcc.absolutePath.replace('\\', '/')}"
		}
		commandLine command
	}
	if (cudaRoot) {
		environment "CUDA_PATH", cudaRoot.absolutePath
		environment "CUDAToolkit_ROOT", cudaRoot.absolutePath
		environment "PATH", "${new File(cudaRoot, "bin").absolutePath}${File.pathSeparator}${System.getenv("PATH") ?: ""}"
	}
}

tasks.register('buildNative', Exec) {
	description = 'Build native library via CMake'
	dependsOn cmakeConfigure
	workingDir = cmakeBuildDir
	inputs.file("${cmakeBuildDir}/CMakeCache.txt")
	outputs.file("${cmakeBuildDir}/lib/${nativeLibName}")
	if (cudaRoot) {
		environment "CUDA_PATH", cudaRoot.absolutePath
		environment "CUDAToolkit_ROOT", cudaRoot.absolutePath
		environment "PATH", "${new File(cudaRoot, "bin").absolutePath}${File.pathSeparator}${System.getenv("PATH") ?: ""}"
	}
	commandLine cmakeExecutable?.absolutePath ?: 'cmake', '--build', '.', '--target', 'install'
}

tasks.register('copyNativeLib', Sync) {
	description = 'Stage native library into the build directory for resource packaging'
	dependsOn buildNative
	from(cmakeInstallLibDir) {
		include nativePatterns
	}
	into generatedNativeDir
}

tasks.named('processResources') {
	mustRunAfter copyNativeLib
	from(layout.projectDirectory.dir('native')) {
		into('native')
		includeEmptyDirs = false
		include '**/*'
		exclude { details ->
			details.relativePath.segments.length == 2 &&
					details.relativePath.segments[0] == nativeClassifier &&
					new File(generatedNativeDir, details.relativePath.segments[1]).exists()
		}
	}
	from(generatedNativeRootDir) {
		into('native')
		includeEmptyDirs = false
		include "${nativeClassifier}/**"
	}
	from(rootProject.file('LICENSE')) {
		into 'META-INF'
	}
	from(rootProject.file('THIRD_PARTY_NOTICES.md')) {
		into 'META-INF'
	}
}

tasks.named('jar') {
	dependsOn copyNativeLib
}
